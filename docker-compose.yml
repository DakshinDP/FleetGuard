name: fleetguard
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetguard}
      POSTGRES_USER: ${POSTGRES_USER:-fleetguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes: ["pgdata:/var/lib/postgresql/data", "./database/postgres:/docker-entrypoint-initdb.d:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U fleetguard -d fleetguard"], interval: 5s, timeout: 3s, retries: 30}
    ports: ["127.0.0.1:5432:5432"]
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    volumes: ["chdata:/var/lib/clickhouse", "./database/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]
    healthcheck: {test: ["CMD", "clickhouse-client", "--query", "SELECT 1"], interval: 5s, timeout: 3s, retries: 30}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 30}
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "internal://0.0.0.0:9092,external://0.0.0.0:19092", "--advertise-kafka-addr", "internal://redpanda:9092,external://localhost:19092"]
    ports: ["127.0.0.1:19092:19092"]
    healthcheck: {test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"], interval: 10s, timeout: 5s, retries: 30}
  console:
    image: redpandadata/console:v2.8.2
    environment: {KAFKA_BROKERS: redpanda:9092}
    ports: ["8080:8080"]
    depends_on: {redpanda: {condition: service_healthy}}
  api:
    build: .
    command: ["uvicorn", "fleetguard.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-fleetguard}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-fleetguard}
      CLICKHOUSE_HOST: clickhouse
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    command: ["python", "-m", "fleetguard.worker"]
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-fleetguard}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-fleetguard}
      CLICKHOUSE_HOST: clickhouse
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      redis: {condition: service_healthy}
  simulator:
    build: .
    command: ["python", "-m", "fleetguard.simulator"]
    env_file: .env
    environment: {KAFKA_BOOTSTRAP_SERVERS: redpanda:9092}
    depends_on: {redpanda: {condition: service_healthy}}
  frontend:
    image: nginx:1.27-alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro", "./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:80"]
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.3.0
    volumes: ["./monitoring/grafana:/etc/grafana/provisioning:ro"]
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]
  loadgen:
    profiles: [loadtest]
    build: .
    command: ["python", "-m", "fleetguard.loadgen"]
    env_file: .env
    environment: {KAFKA_BOOTSTRAP_SERVERS: redpanda:9092}
    depends_on: {redpanda: {condition: service_healthy}}
volumes:
  pgdata: {}
  chdata: {}
  redisdata: {}
