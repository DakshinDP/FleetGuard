name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install .[dev]
      - run: python -m unittest discover -s tests -v
      - run: ruff check src
      - uses: aquasecurity/trivy-action@0.28.0
        with: {scan-type: fs, scan-ref: ., severity: CRITICAL,HIGH, exit-code: '1'}
      - run: docker build -t fleetguard:${{ github.sha }} .
      - run: docker build -t fleetguard-web:${{ github.sha }} frontend
