apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: fleetguard}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: ghcr.io/REPLACE_OWNER/fleetguard-web:REPLACE_TAG
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: fleetguard}
spec:
  type: ClusterIP
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
